aid: 1inch
url: https://raw.githubusercontent.com/api-evangelist/1inch/refs/heads/main/apis.yml
name: 1inch
kind: company
description: 1inch is a leading DeFi aggregator providing best-execution swaps across
  decentralized exchanges, an intent-based Fusion order flow, cross-chain Fusion+
  swaps, limit orders, and rich market data. The 1inch Developer Portal (business.1inch.com/portal)
  exposes 13+ REST APIs covering Swap, Orderbook, Spot Price, Token, Token Details,
  Charts, Balance, Portfolio, Transaction Gateway, History, Traces, Gas Price, Web3
  RPC, NFT, and Domains across 14+ EVM and non-EVM chains, distributed under a single
  API key.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- DeFi
- DEX Aggregator
- Swap
- Limit Orders
- Fusion
- Web3
- RPC
- Market Data
created: '2026-05-23'
modified: '2026-05-23'
